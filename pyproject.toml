[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-ark"
version = "0.3.0"
description = "Status-first structured memory (Decisions/Lessons/Status) and precision task routing for AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Lorry Jovens & Aris (LAAP)" }]
keywords = ["agent-memory", "llm", "context-engineering", "mcp", "knowledge-base"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["mnemos_ark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
